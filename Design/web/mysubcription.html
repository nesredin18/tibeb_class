<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Lexend%3Awght%40300%3B400%3B500%3B600%3B700&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #b2cae5;
        --secondary-color: #F8F9FA;
        --text-primary: #101418;
        --text-secondary: #4A5568;--border-color: #E2E8F0;}
      body {
        font-family: 'Lexend', 'Noto Sans', sans-serif;
      }
      .nav-link {
        @apply text-[var(--text-primary)] text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors;
      }
      .profile-card {
        @apply bg-white shadow-lg rounded-xl p-6;
      }
      .section-title {
        @apply text-[var(--text-primary)] text-xl font-semibold leading-tight tracking-tight;
      }
      .detail-row {
        @apply grid grid-cols-[auto_1fr] gap-x-6 border-t border-[var(--border-color)] py-5 items-center;
      }
      .detail-label {
        @apply text-[var(--text-secondary)] text-sm font-normal leading-normal;
      }
      .detail-value {
        @apply text-[var(--text-primary)] text-sm font-medium leading-normal;}
      .action-button {
        @apply flex w-full items-center justify-center rounded-lg h-11 px-5 text-sm font-semibold leading-normal tracking-wide transition-colors;
      }
      .action-button-primary {
        @apply bg-[var(--primary-color)] text-white hover:bg-opacity-90;
      }
      .action-button-secondary {
        @apply bg-white text-[var(--primary-color)] border border-[var(--primary-color)] hover:bg-[var(--primary-color)] hover:text-white;
      }
      .action-button-danger {
        @apply bg-transparent text-red-600 hover:bg-red-50;
      }
      .pill-badge {
        @apply inline-block px-3 py-1 text-xs font-semibold leading-none text-white bg-[var(--primary-color)] rounded-full;
      }
    </style>
</head>
<body class="bg-[var(--secondary-color)]">
<div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">

<main class="px-4 sm:px-6 md:px-10 lg:px-20 xl:px-40 flex flex-1 justify-center py-8">
<div class="layout-content-container flex flex-col max-w-4xl w-full gap-8">
<header class="flex flex-wrap justify-between items-center gap-4">
<h1 class="text-[var(--text-primary)] text-3xl font-bold leading-tight">Subscription</h1>
</header>
<section class="profile-card">
<div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
<div class="flex flex-col gap-2">
<p class="text-[var(--text-secondary)] text-sm font-normal">Current Plan</p>
<div class="flex items-center gap-3">
<h2 class="text-[var(--text-primary)] text-2xl font-semibold">Premium</h2>
<span class="pill-badge">Active</span>
</div>
<p class="text-[var(--text-secondary)] text-sm font-normal">Renews on July 15, 2024</p>
</div>
<div class="w-full md:w-56 h-32 bg-center bg-no-repeat bg-cover rounded-lg shadow-md" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCxpTUxBrXK60r00uqC5TZG0_m_si_NwRdNLY8X-8hRKYe4GJAMf2eimBpoEKrkk8p6B6bI8PObknm4vmuoNabstSs-a-p_hChjAsjrd2AN2UmijcMLspuJ-YLpEh_GcheZ16-Y9DTnFl_g9HPhLiyBo7eV23cuYfLdFSiMm7N3r-7tpthbnG1nUHONvnh4MYmQzCeVv_7uirdHmqTW2GsV7SPmQeHqEfn_z3m4Egk6ld1sk72qHVBSzN8HONjw_hqde2rFUxldGQZ6");'></div>
</div>
</section>
<section class="profile-card">
<h3 class="section-title mb-6">Plan Details</h3>
<div class="grid gap-y-0">
<div class="detail-row">
<p class="detail-label">Plan</p>
<p class="detail-value">Premium</p>
</div>
<div class="detail-row">
<p class="detail-label">Renewal Date</p>
<p class="detail-value">July 15, 2024</p>
</div>
<div class="detail-row">
<p class="detail-label">Benefits</p>
<p class="detail-value">Access to all courses, offline viewing, priority support, exclusive content</p>
</div>
<div class="detail-row border-b border-[var(--border-color)]">
<p class="detail-label">Price</p>
<p class="detail-value">$19.99 / month</p>
</div>
</div>
</section>
<section class="profile-card">
<h3 class="section-title mb-6">Manage Subscription</h3>
<div class="flex flex-col sm:flex-row gap-4 items-center">
<button class="action-button action-button-primary flex-1">
<svg class="mr-2" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><line x1="12" x2="12" y1="5" y2="19"></line><line x1="5" x2="19" y1="12" y2="12"></line></svg>
                  Upgrade Plan
                </button>
<button class="action-button action-button-secondary flex-1">
<svg class="mr-2" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                  Change Plan
                </button>
<button class="action-button action-button-danger flex-1">
<svg class="mr-2" fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>
                  Cancel Subscription
                </button>
</div>
</section>
</div>
</main>

</div>
</div>

</body></html>
