<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Lexend%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');
        --primary-color: #b2cae5;
      }
      body {
        font-family: Lexend, "Noto Sans", sans-serif;
      }
    </style>
</head>
<body>
<div class="relative flex size-full min-h-screen flex-col bg-slate-50 group/design-root overflow-x-hidden text-slate-900">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 px-10 py-4 shadow-sm">
<div class="flex items-center gap-3 text-slate-900">
<svg class="h-8 w-8 text-[var(--primary-color)]" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path></svg>
<h2 class="text-slate-900 text-xl font-bold leading-tight tracking-[-0.015em]">EduHub Ethiopia</h2>
</div>
</header>
<main class="flex flex-1 justify-center items-center py-16 px-4">
<div class="layout-content-container flex flex-col w-full max-w-md bg-white shadow-xl rounded-xl p-8 md:p-12">
<h2 class="text-slate-900 tracking-tight text-3xl font-bold leading-tight text-center mb-8">Welcome Back!</h2>
<form class="space-y-6">
<div>
<label class="sr-only" for="email">Username or Email</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] border-slate-300 bg-slate-50 h-14 placeholder:text-slate-500 p-4 text-base font-normal leading-normal" id="email" placeholder="Username or Email" type="email" value=""/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] border-slate-300 bg-slate-50 h-14 placeholder:text-slate-500 p-4 text-base font-normal leading-normal" id="password" placeholder="Password" type="password" value=""/>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-5 w-5 rounded border-slate-400 bg-slate-50 text-[var(--primary-color)] checked:bg-[var(--primary-color)] checked:border-[var(--primary-color)] checked:bg-[image:--checkbox-tick-svg] focus:ring-2 focus:ring-offset-1 focus:ring-[var(--primary-color)] focus:ring-offset-white" id="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-slate-700" for="remember-me">Remember me</label>
</div>
<a class="text-sm font-medium text-[var(--primary-color)] hover:text-opacity-80 underline" href="#">Forgot password?</a>
</div>
<div>
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-[var(--primary-color)] text-white text-lg font-semibold leading-normal tracking-wide hover:bg-opacity-90 transition-colors duration-150 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--primary-color)]" type="submit">
                  Log In
                </button>
</div>
</form>
<div class="mt-8 text-center">
<p class="text-slate-600 text-sm font-normal leading-normal mb-4">Or continue with</p>
<div class="flex flex-col sm:flex-row gap-4">
<button class="flex flex-1 items-center justify-center gap-2 min-w-[84px] cursor-pointer overflow-hidden rounded-lg h-12 px-4 bg-slate-100 text-slate-700 text-sm font-medium leading-normal tracking-wide hover:bg-slate-200 transition-colors duration-150 border border-slate-300 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-[var(--primary-color)]">
<svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.0023 12.0002C22.0023 11.2052 21.9283 10.4202 21.7883 9.66016H12.2303V13.9502H17.7803C17.5703 15.3302 16.8503 16.5402 15.7803 17.3302V19.8902H19.4703C21.1103 18.2502 22.0023 15.4302 22.0023 12.0002Z" fill="#4285F4"></path><path d="M12.2305 22.0002C14.7905 22.0002 16.9405 21.1802 18.4705 19.8902L15.7805 17.3302C14.9705 17.8602 13.7305 18.2502 12.2305 18.2502C9.60049 18.2502 7.33049 16.5702 6.48049 14.3002H2.67049V16.9502C4.25049 19.9902 7.94049 22.0002 12.2305 22.0002Z" fill="#34A853"></path><path d="M6.48043 14.3001C6.23043 13.5801 6.08043 12.8001 6.08043 12.0001C6.08043 11.2001 6.23043 10.4201 6.48043 9.70008V7.05008H2.67043C1.99043 8.43008 1.56043 10.0101 1.56043 12.0001C1.56043 13.9901 1.99043 15.5701 2.67043 16.9501L6.48043 14.3001Z" fill="#FBBC05"></path><path d="M12.2305 5.75C13.8605 5.75 15.0705 6.34 15.6205 6.86L18.5405 4.00001C16.9305 2.47 14.7905 1.5 12.2305 1.5C7.94049 1.5 4.25049 3.51001 2.67049 6.55001L6.48049 9.20001C7.33049 6.93001 9.60049 5.75 12.2305 5.75Z" fill="#EA4335"></path></svg>
<span>Google</span>
</button>
<button class="flex flex-1 items-center justify-center gap-2 min-w-[84px] cursor-pointer overflow-hidden rounded-lg h-12 px-4 bg-slate-100 text-slate-700 text-sm font-medium leading-normal tracking-wide hover:bg-slate-200 transition-colors duration-150 border border-slate-300 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-[var(--primary-color)]">
<svg class="h-5 w-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path></svg>
<span>Facebook</span>
</button>
</div>
</div>
<p class="text-slate-600 text-sm font-normal leading-normal mt-8 text-center">
              Don't have an account?
              <a class="font-medium text-[var(--primary-color)] hover:text-opacity-80 underline" href="#">Sign up</a>
</p>
</div>
</main>
</div>
</div>

</body></html>
