<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Lexend%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>EthioLearn - Sign Up</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1978e5;
        --primary-text-color: #0e141b;
        --secondary-text-color: #4e7097;
        --background-color: #f8fafc;--input-background-color: #e8eff7;--border-color: #cbd5e1;}
      .form-input {
        @apply w-full rounded-lg border border-[var(--border-color)] bg-[var(--input-background-color)] p-4 text-base text-[var(--primary-text-color)] placeholder-[var(--secondary-text-color)] focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)] transition-colors duration-200;
      }
      .form-label {
        @apply text-sm font-medium text-[var(--primary-text-color)] mb-1;
      }
      .radio-label {
        @apply flex items-center justify-center rounded-lg border border-[var(--border-color)] px-4 py-2.5 text-sm font-medium text-[var(--primary-text-color)] cursor-pointer transition-all duration-200 ease-in-out hover:border-[var(--primary-color)] has-[:checked]:border-[var(--primary-color)] has-[:checked]:bg-[var(--primary-color)] has-[:checked]:text-white has-[:checked]:shadow-md;
      }
    </style>
</head>
<body class="bg-[var(--background-color)]" style="font-family: Lexend, 'Noto Sans', sans-serif;">
<div class="relative flex min-h-screen flex-col group/design-root">
<div class="layout-container flex h-full grow flex-col">
<header class="sticky top-0 z-10 flex items-center justify-between whitespace-nowrap border-b border-solid border-[var(--border-color)] bg-[var(--background-color)]/80 px-6 py-4 shadow-sm backdrop-blur-md md:px-10">
<div class="flex items-center gap-3">
<div class="size-7 text-[var(--primary-color)]">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h1 class="text-[var(--primary-text-color)] text-xl font-bold leading-tight tracking-tight">EthioLearn</h1>
</div>

</header>
<main class="flex flex-1 items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8 rounded-xl bg-white p-6 shadow-xl sm:p-8">
<div>
<h2 class="text-center text-3xl font-bold tracking-tight text-[var(--primary-text-color)]">Create your account</h2>
<p class="mt-2 text-center text-sm text-[var(--secondary-text-color)]">
                Start your learning journey with EthioLearn.
              </p>
</div>
<form class="space-y-6">
<div>
<label class="form-label" for="phone">Phone number</label>
<input class="form-input h-12" id="phone" name="phone" placeholder="Enter your phone number" type="tel"/>
</div>
<div>
<label class="form-label" for="email">Email address</label>
<input class="form-input h-12" id="email" name="email" placeholder="Enter your email" type="email"/>
</div>
<div>
<span class="form-label block">I am a...</span>
<div class="mt-2 grid grid-cols-2 gap-3">
<label class="radio-label">
                    Student
                    <input checked="" class="sr-only" name="role" type="radio" value="student"/>
</label>
<label class="radio-label">
                    Parent
                    <input class="sr-only" name="role" type="radio" value="parent"/>
</label>
</div>
</div>
<div>
<label class="form-label" for="password">Password</label>
<input class="form-input h-12" id="password" name="password" placeholder="Create a password" type="password"/>
</div>
<div>
<label class="form-label" for="confirm-password">Confirm password</label>
<input class="form-input h-12" id="confirm-password" name="confirm-password" placeholder="Confirm your password" type="password"/>
</div>
<div>
<label class="form-label" for="grade">Grade</label>
<select class="form-input h-12 appearance-none bg-[var(--input-background-color)] bg-no-repeat bg-[right_1rem_center] bg-[length:1.5em_1.5em]" id="grade" name="grade" style="background-image: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27none%27 viewBox=%270 0 20 20%27%3e%3cpath stroke%3d%27%236b7280%27 stroke-linecap%3d%27round%27 stroke-linejoin%3d%27round%27 stroke-width%3d%271.5%27 d%3d%27M6 8l4 4 4-4%27/%3e%3c/svg%3e');">
<option disabled="" selected="" value="">Select your grade</option>
<option value="1">Grade 1</option>
<option value="2">Grade 2</option>
<option value="3">Grade 3</option>
<option value="4">Grade 4</option>
<option value="5">Grade 5</option>
<option value="6">Grade 6</option>
<option value="7">Grade 7</option>
<option value="8">Grade 8</option>
<option value="9">Grade 9</option>
<option value="10">Grade 10</option>
<option value="11">Grade 11</option>
<option value="12">Grade 12</option>
</select>
</div>
<div>
<button class="flex w-full justify-center rounded-lg bg-[var(--primary-color)] py-3 px-4 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--primary-color)] transition-colors duration-200 h-12" type="submit">
                  Sign up
                </button>
</div>
</form>
<p class="text-center text-sm text-[var(--secondary-text-color)]">
              Already have an account?
              <a class="font-medium text-[var(--primary-color)] hover:text-indigo-500 underline" href="#">Log in</a>
</p>
</div>
</main>
</div>
</div>

</body></html>
