<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Lexend%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
      .material-symbols-rounded {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50">
<div class="relative flex size-full min-h-screen flex-col justify-between group/design-root overflow-x-hidden" style='font-family: Lexend, "Noto Sans", sans-serif;'>
<div class="flex-grow">
<header class="flex items-center bg-slate-50 p-4 pb-3 sticky top-0 z-10">
<button class="text-slate-700 p-2 -ml-2">
<span class="material-symbols-rounded text-2xl">arrow_back_ios_new</span>
</button>
<h1 class="text-slate-900 text-xl font-semibold leading-tight flex-1 text-center pr-6">Subscription</h1>
</header>
<main class="px-4 pt-4 pb-8 space-y-6">
<section>
<h2 class="text-slate-800 text-lg font-semibold leading-tight mb-3">Current Plan</h2>
<div class="bg-white shadow-sm rounded-xl p-4">
<div class="flex items-center gap-4 mb-4">
<div class="flex items-center justify-center rounded-full bg-blue-100 text-blue-600 shrink-0 size-12">
<span class="material-symbols-rounded text-3xl">workspace_premium</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-slate-900 text-lg font-medium leading-normal">Premium</p>
<p class="text-green-600 text-sm font-medium leading-normal bg-green-100 px-2 py-0.5 rounded-full inline-block self-start">Active</p>
</div>
</div>
<div class="space-y-3 border-t border-slate-200 pt-4">
<div class="flex justify-between items-center">
<p class="text-slate-600 text-sm font-normal">Renewal Date</p>
<p class="text-slate-800 text-sm font-medium">July 15, 2024</p>
</div>
<div>
<p class="text-slate-600 text-sm font-normal mb-1">Features</p>
<p class="text-slate-800 text-sm font-normal leading-relaxed">Unlimited access to all courses, personalized learning paths, and premium support.</p>
</div>
</div>
</div>
</section>
<section>
<h2 class="text-slate-800 text-lg font-semibold leading-tight mb-3">Manage Subscription</h2>
<div class="space-y-2">
<button class="flex items-center gap-3 bg-white shadow-sm rounded-xl p-4 w-full text-left hover:bg-slate-50 transition-colors">
<div class="text-red-500 flex items-center justify-center rounded-lg bg-red-100 shrink-0 size-10">
<span class="material-symbols-rounded text-2xl">cancel</span>
</div>
<p class="text-red-600 text-base font-medium flex-1">Cancel Subscription</p>
<span class="material-symbols-rounded text-slate-400 text-2xl">chevron_right</span>
</button>
<button class="flex items-center gap-3 bg-white shadow-sm rounded-xl p-4 w-full text-left hover:bg-slate-50 transition-colors">
<div class="text-blue-600 flex items-center justify-center rounded-lg bg-blue-100 shrink-0 size-10">
<span class="material-symbols-rounded text-2xl">swap_horiz</span>
</div>
<p class="text-slate-900 text-base font-medium flex-1">Change Plan</p>
<span class="material-symbols-rounded text-slate-400 text-2xl">chevron_right</span>
</button>
</div>
</section>
</main>
</div>
<nav class="sticky bottom-0 bg-white border-t border-slate-200 shadow-t-sm">
<div class="flex justify-around items-center px-2 py-2">
<a class="flex flex-col items-center justify-end gap-0.5 rounded-lg text-blue-600 p-2" href="#">
<span class="material-symbols-rounded text-2xl" style="font-variation-settings: 'FILL' 1;">home</span>
<p class="text-xs font-medium tracking-tight">Home</p>
</a>
<a class="flex flex-col items-center justify-end gap-0.5 rounded-lg text-slate-500 hover:text-blue-600 p-2" href="#">
<span class="material-symbols-rounded text-2xl">school</span>
<p class="text-xs font-medium tracking-tight">Learn</p>
</a>
<a class="flex flex-col items-center justify-end gap-0.5 rounded-lg text-slate-500 hover:text-blue-600 p-2" href="#">
<span class="material-symbols-rounded text-2xl">groups</span>
<p class="text-xs font-medium tracking-tight">Community</p>
</a>
<a class="flex flex-col items-center justify-end gap-0.5 rounded-lg text-slate-500 hover:text-blue-600 p-2" href="#">
<span class="material-symbols-rounded text-2xl">person</span>
<p class="text-xs font-medium tracking-tight">Profile</p>
</a>
</div>
<div class="h-safe-area-bottom bg-white"></div>
</nav>
</div>

</body></html>
